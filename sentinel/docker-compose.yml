version: "3.9"

services:

  # ChromaDB vector store
  sentinel-chromadb:
    image: chromadb/chroma:latest
    container_name: sentinel-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # FastAPI backend
  sentinel-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_HOST=sentinel-chromadb
      - CHROMA_PORT=8001
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - OLLAMA_API_URL=http://host.docker.internal:11434
    depends_on:
      - sentinel-chromadb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml_models:/app/ML/models
      - ./backend:/app
    restart: unless-stopped

  # Streamlit frontend
  sentinel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "8501:8501"
    env_file:
      - ./backend/.env
    environment:
      - API_URL=http://sentinel-api:8000
    depends_on:
      - sentinel-api
    volumes:
      - ./frontend:/app
    restart: unless-stopped

volumes:
  chroma_data:
  ml_models:
